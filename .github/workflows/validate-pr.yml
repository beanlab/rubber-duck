name: Validate application image

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Poetry lockfile
        run: |
          python -m pip install "poetry==2.5.1"
          poetry check --lock

      - name: Build application image
        run: docker build --pull --tag rubber-duck:pr .
