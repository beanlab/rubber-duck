name: Build, provision, and deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rubber-duck-production
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "844825014198"
  AWS_REGION: us-west-2
  AWS_ROLE_ARN: arn:aws:iam::844825014198:role/rubber-duck-github-deploy
  ECR_REPOSITORY: beanlab/rubber-duck
  ECR_REGISTRY: 844825014198.dkr.ecr.us-west-2.amazonaws.com
  TF_VERSION: "1.15.8"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.prepare.outputs.branch }}
      environment: ${{ steps.prepare.outputs.environment }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
      image_tag: ${{ steps.prepare.outputs.image_tag }}
      image_uri: ${{ steps.prepare.outputs.image_uri }}
      state_key: ${{ steps.prepare.outputs.state_key }}
      configuration_uri: ${{ steps.prepare.outputs.configuration_uri }}
    steps:
      - name: Validate explicit branch mapping
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || {
            echo "Only refs/heads/master can deploy" >&2
            exit 1
          }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "A full Git commit SHA is required" >&2
            exit 1
          }
          environment=production
          image_tag="$environment-$GITHUB_SHA"
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag"
          {
            echo "branch=master"
            echo "environment=$environment"
            echo "commit_sha=$GITHUB_SHA"
            echo "image_tag=$image_tag"
            echo "image_uri=$image_uri"
            echo "state_key=rubber-duck/environments/$environment/terraform.tfstate"
            echo "configuration_uri=s3://rubber-duck-config/environments/$environment/config.yaml"
          } >>"$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
      image_digest_uri: ${{ steps.digest.outputs.image_digest_uri }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$AWS_ACCOUNT_ID" ]]

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push exact source image
        env:
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker buildx build \
            --pull \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            --label "org.opencontainers.image.source=$repository_url" \
            --label "org.opencontainers.image.created=$created" \
            --label "org.opencontainers.image.ref.name=$ENVIRONMENT" \
            --label "com.byubean.rubber-duck.environment=$ENVIRONMENT" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --push \
            .

      - name: Resolve pushed digest
        id: digest
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_digest=$digest" >>"$GITHUB_OUTPUT"
          echo "image_digest_uri=$ECR_REGISTRY/$ECR_REPOSITORY@$digest" >>"$GITHUB_OUTPUT"

  provision:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    outputs:
      instance_id: ${{ steps.outputs.outputs.instance_id }}
      ami_id: ${{ steps.outputs.outputs.ami_id }}
      volume_id: ${{ steps.outputs.outputs.volume_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and initialize Terraform
        working-directory: aws/terraform/environment
        env:
          STATE_KEY: ${{ needs.prepare.outputs.state_key }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$AWS_ACCOUNT_ID" ]]
          terraform fmt -check -recursive
          terraform init -input=false \
            -backend-config="bucket=rubber-duck-terraform-state-$AWS_ACCOUNT_ID" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config=use_lockfile=true \
            -backend-config=encrypt=true
          terraform validate

      - name: Plan and apply production
        working-directory: aws/terraform/environment
        shell: bash
        run: |
          set -Eeuo pipefail
          terraform plan -input=false -var-file=environments/production.tfvars -out=production.tfplan
          terraform apply -input=false -auto-approve production.tfplan

      - name: Export environment outputs
        id: outputs
        working-directory: aws/terraform/environment
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "instance_id=$(terraform output -raw instance_id)" >>"$GITHUB_OUTPUT"
          echo "ami_id=$(terraform output -raw ami_id)" >>"$GITHUB_OUTPUT"
          echo "volume_id=$(terraform output -raw volume_id)" >>"$GITHUB_OUTPUT"

  maintain:
    runs-on: ubuntu-latest
    needs: [prepare, provision]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for bootstrap and update host
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          wait_for_ssm() {
            for _ in $(seq 1 120); do
              status=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || true)
              [[ "$status" == Online ]] && return 0
              sleep 5
            done
            echo "timed out waiting for SSM" >&2
            return 1
          }

          run_ssm() {
            local command=$1 polls=${2:-180} command_id status output
            command_id=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$(jq -cn --arg command "$command" '{commands:[$command]}')" \
              --query 'Command.CommandId' \
              --output text)
            for _ in $(seq 1 "$polls"); do
              status=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true)
              case "$status" in
                Success)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$INSTANCE_ID" \
                    --query StandardOutputContent \
                    --output text
                  return 0
                  ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$INSTANCE_ID" \
                    --output json >&2
                  return 1
                  ;;
              esac
              sleep 5
            done
            echo "SSM command timed out: $command_id" >&2
            return 1
          }

          wait_for_ssm
          run_ssm 'cloud-init status --wait >/dev/null && test -f /var/lib/rubber-duck-bootstrap/complete'
          update_output=$(run_ssm 'sudo /usr/local/sbin/update-host.sh')
          printf '%s\n' "$update_output"
          [[ "$update_output" == reboot-required=true || "$update_output" == reboot-required=false ]]

          if [[ "$update_output" == reboot-required=true ]]; then
            previous_boot_id=$(run_ssm 'cat /proc/sys/kernel/random/boot_id')
            run_ssm "sudo systemd-run --on-active=5s --unit=rubber-duck-reboot systemctl reboot"
            sleep 15
            reboot_complete=false
            for _ in $(seq 1 120); do
              status=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || true)
              if [[ "$status" == Online ]]; then
                current_boot_id=$(run_ssm 'cat /proc/sys/kernel/random/boot_id' 12 2>/dev/null || true)
                if [[ -n "$current_boot_id" && "$current_boot_id" != "$previous_boot_id" ]]; then
                  reboot_complete=true
                  break
                fi
              fi
              sleep 5
            done
            [[ "$reboot_complete" == true ]] || {
              echo "timed out waiting for SSM after reboot" >&2
              exit 1
            }
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build, provision, maintain]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy digest through SSM
        env:
          INSTANCE_ID: ${{ needs.provision.outputs.instance_id }}
          AMI_ID: ${{ needs.provision.outputs.ami_id }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          IMAGE_DIGEST_URI: ${{ needs.build.outputs.image_digest_uri }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v command 'sudo /usr/local/sbin/deploy-container.sh %q %q %q' \
            "$IMAGE_DIGEST_URI" "$COMMIT_SHA" "$IMAGE_TAG"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -cn --arg command "$command" '{commands:[$command]}')" \
            --query 'Command.CommandId' \
            --output text)

          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                printf 'deployment-result=success environment=%s branch=%s commit=%s tag=%s digest=%s ami=%s instance=%s\n' \
                  "$ENVIRONMENT" "$BRANCH" "$COMMIT_SHA" "$IMAGE_TAG" "$IMAGE_DIGEST" "$AMI_ID" "$INSTANCE_ID"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --output json >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "deployment SSM command timed out: $command_id" >&2
          exit 1
