sql:
  db_type: sqlite
  database: scratch/refactor.db

containers:
  cs-python-sandbox:
    image: byucscourseops/python-tools-sandbox:latest
    settings:
      working_dir: /home/sandbox/out
    resources:
      - source: datasets/carprice.csv
        target: /home/sandbox/datasets/

  stats-python-sandbox:
    image: byucscourseops/python-tools-sandbox:latest
    settings:
      timeout: 10
      working_dir: /home/sandbox/out
      network_mode: none
      memory: 1g
      memory_swap: 1g
      cpus: 1
      pids_limit: 128
      read_only_root: false
    resources:
      - source: datasets/
        target: /home/sandbox/datasets/

tools:
  run_cs_analysis:
    type: container_exec
    container: cs-python-sandbox

  run_python:
    type: container_exec
    container: stats-python-sandbox
    cache:
      backend: database
      prompt: src/prompts/production-prompts/stats-cache.md
      engine: gpt-5.6-luna
      reasoning: none

ducks:
  standard-rubber-duck:
    builder: src.workflows.standard_duck.standard_duck_workflow:build
    settings:
      agent:
        name: RubberDuck
        prompt_files:
          - src/prompts/production-prompts/standard-rubber-duck-ai-responses.md
        engine: gpt-5.6-luna
        reasoning: low
        tools: []

  stats-duck:
    builder: src.workflows.stats_duck.stats_duck_workflow:build
    settings:
      introduction: >
        I can perform many statistical operations on a list of provided datasets.
        If you want more specifics, please ask. How can I help you with stats?
      agent:
        name: stats_duck
        prompt_files:
          - src/prompts/production-prompts/stats-ai-responses.md
        engine: gpt-5.6-luna
        reasoning: low
        tools:
          - run_python
          - describe_dataset
          - send_datasets_to_user

  cs-stats-duck:
    builder: src.workflows.stats_duck.stats_duck_workflow:build
    settings:
      introduction: >
        I can answer questions about CS grades and enrollment trends.
        If you want more specifics, please ask.
        What can I do for you today?
      agent:
        name: cs_stats_duck
        prompt_files:
          - src/prompts/production-prompts/cs-stats.md
        engine: gpt-5.6-luna
        reasoning: medium
        tools:
          - run_cs_analysis
          - describe_dataset

servers:
  example-server:
    server_id: "SERVER_ID"
    channels:
      standard-duck:
        channel_id: "STANDARD_DUCK_CHANNEL_ID"
        timeout: 300
        duck: standard-rubber-duck
      cs-stats-duck:
        channel_id: "CS_STATS_DUCK_CHANNEL_ID"
        timeout: 100
        duck: cs-stats-duck
      stats-duck:
        channel_id: "STATS_DUCK_CHANNEL_ID"
        timeout: 300
        duck: stats-duck

admin_settings:
  $include: "../production-config.yaml@$.admin_settings"
  admin_channel_id: "ADMIN_CHANNEL_ID"
  admin_role_id: "ADMIN_ROLE_ID"

bot-friends:
  - "BOT_FRIEND_USER_ID"

ai_completion_retry_protocol:
  $include: "../production-config.yaml@$.ai_completion_retry_protocol"

reporter_settings:
  $include: "../production-config.yaml@$.reporter_settings"

cache_cleanup_settings:
  $include: "../production-config.yaml@$.cache_cleanup_settings"
