sql:
  db_type: sqlite
  database: /rubber-duck.db

containers:
  stats-python-sandbox:
    image: byucscourseops/python-tools-sandbox:latest
    settings:
      timeout: 10
      working_dir: /home/sandbox/out
      network_mode: none
      memory: 1g
      memory_swap: 1g
      cpus: 1
      pids_limit: 128
      read_only_root: false
    resources:
    - source: s3://stats121-datasets/datasets/
      target: /home/sandbox/datasets/

cache_cleanup_settings:
  cleanup_hour: 5
  cleanup_minute: 0

ducks:
  standard-rubber-duck:
    builder: src.workflows.standard_duck.standard_duck_workflow:build
    settings:
      agent:
        name: RubberDuck
        prompt_files:
        - src/prompts/production-prompts/standard-rubber-duck-ai-responses.md
        engine: gpt-5.6-luna
        reasoning: low
        tools: []
  stats-duck:
    builder: src.workflows.stats_duck.stats_duck_workflow:build
    settings:
      agent:
        name: stats_duck
        prompt_files:
        - src/prompts/production-prompts/stats-ai-responses.md
        engine: gpt-5.6-luna
        reasoning: low
        tools: []

