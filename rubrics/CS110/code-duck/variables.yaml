      After the TA fixes Student_Name to student_name, the student runs the project again and sees this exact traceback:

      Traceback (most recent call last):
        File "/tmp/code-duck-grade-summary-sequence/after_name_fix_type_error/grade_summary.py", line 12, in <module>
          print(total_points + extra_credit)
                ~~~~~~~~~~~~~^~~~~~~~~~~~~~
      TypeError: unsupported operand type(s) for +: 'int' and 'str'

      total_points = 10
      extra_credit = "5"
      print(total_points + extra_credit)

      Required concept: the value assigned to a variable has a type; `"5"` is text, not the number `5`, so it cannot be added to an integer without conversion or changing the assigned value.
      Required fix: Change `extra_credit = "5"` to `extra_credit = 5`.
  variables must be assigned before they are used:
    - |-
      After the TA fixes extra_credit to a number, the student runs the project again and sees this exact traceback:

      Traceback (most recent call last):
        File "/tmp/code-duck-grade-summary-sequence/after_type_fix_missing_name/grade_summary.py", line 15, in <module>
          print(missing_assignments)
                ^^^^^^^^^^^^^^^^^^^
      NameError: name 'missing_assignments' is not defined

      print(missing_assignments)
      missing_assignments = 7

      Required concept: assignment creates the variable name before later lines can use it; a variable cannot be printed before the assignment statement has run.
      Required fix: Move `missing_assignments = 7` before `print(missing_assignments)`.
